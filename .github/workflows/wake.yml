# Keeps the server awake in the evening, when most rounds are played.
# Render's free plan puts the server to sleep after 15 minutes without visits, and waking up takes about 2 minutes.
# The results never depend on this (a sleeping server catches up when it wakes); it only saves the first
# viewer of a live round from waiting.
#
# GitHub uses UTC: 15:00-21:59 UTC is 17:00-23:59 in Israel in winter, and 18:00-00:59 in summer.
# GitHub may start a scheduled run a few minutes late, so it runs every 10 minutes, not every 15.

name: Wake server

on:
  schedule:
    - cron: "*/10 15-21 * * *"
  # A "Run workflow" button in the Actions tab, to try it by hand.
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Visit the site
        # Up to 3 tries with 2 minutes each: the first visit after sleeping can be slow.
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 120 --output /dev/null https://friendsleague.onrender.com/; then
              echo "Server is awake"
              exit 0
            fi
            echo "Attempt $attempt failed, trying again"
          done
          exit 1
